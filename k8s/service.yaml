apiVersion: v1
kind: Service
metadata:
  name: fraud-lake-api
  namespace: fraud-lake
  labels:
    app.kubernetes.io/name: fraud-lake-api
spec:
  # ClusterIP, not LoadBalancer. A LoadBalancer service provisions an ALB/NLB that
  # Terraform does not know about, so `terraform destroy` cannot remove it and it keeps
  # billing after the cluster is gone. The ingress below owns external exposure.
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: fraud-lake-api
