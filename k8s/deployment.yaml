apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-lake-api
  namespace: fraud-lake
  labels:
    app.kubernetes.io/name: fraud-lake-api
    app.kubernetes.io/part-of: fraud-lake
spec:
  # The HPA owns this after the first reconcile. Two replicas so a rolling update never
  # drops to zero available pods on a 2-node cluster.
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-lake-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-lake-api
        app.kubernetes.io/part-of: fraud-lake
    spec:
      serviceAccountName: fraud-lake-api
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Spread across nodes so losing one node cannot take out every replica. On a 2-node
      # cluster this is what makes the HPA scale-out land somewhere useful.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fraud-lake-api

      containers:
        - name: api
          # Replaced by kustomize with the ECR image URI.
          image: fraud-lake/api:latest
          # Always: this deployment tracks a mutable :latest tag, so IfNotPresent would
          # pin each node to whatever it pulled first — rollouts would silently no-op.
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: fraud-lake-config

          # requests, not limits, on CPU: a CPU limit throttles rather than evicts, and
          # throttling an IO-bound service adds latency for no isolation benefit. The
          # memory limit IS set, because memory exhaustion takes the node with it.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # Three probes, three different questions.
          # startup:   "has it finished booting?" — generous, so a slow import does not
          #            get the pod killed in a loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 5

          # readiness: "should it receive traffic right now?"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          # liveness:  "is it wedged and in need of a restart?" — deliberately slower and
          #            more forgiving than readiness. A liveness probe as aggressive as
          #            readiness turns a slow dependency into a restart loop.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # Long enough for an in-flight agent call — which may be waiting on Athena — to
      # finish rather than being cut off mid-answer.
      terminationGracePeriodSeconds: 45
