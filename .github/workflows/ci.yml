name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# OIDC, not long-lived keys. A portfolio repo with an AWS access key in its secrets is a
# credential that outlives your interest in the project.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install ruff==0.6.*

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # PySpark needs a JVM. Spark 3.5 supports Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "pyspark==3.5.*"

      - name: Unit tests — generator, validator, supervisor, API
        run: pytest tests/ --ignore=tests/test_transforms.py -q

      # Split out because the Spark session takes ~10s to start and its failures have a
      # different flavour — a broken window spec, not a broken contract.
      - name: PySpark transform tests
        run: pytest tests/test_transforms.py -q

      - name: SQL validator adversarial tests
        # Run again on their own so a regression in the security boundary is unmissable in
        # the job list rather than buried in a combined summary.
        run: pytest tests/test_sql_validator.py -q --tb=short

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -recursive -check terraform/

      - name: terraform validate — modules
        run: |
          for module in terraform/modules/*/; do
            echo "::group::validate $module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
            echo "::endgroup::"
          done

      # `plan` needs credentials and reads real state, so it only runs when the repo is
      # configured with a role to assume. Without that this job still validates syntax and
      # module wiring, which is most of the value.
      - name: Configure AWS credentials
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan — dev
        if: vars.AWS_ROLE_ARN != ''
        run: |
          make package
          terraform -chdir=terraform/envs/dev init -input=false
          terraform -chdir=terraform/envs/dev plan -input=false -no-color

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Images are only pushed from main. A PR proves the build works without filling ECR
    # with layers from every branch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Matches the ARM64 runtime platform on the Fargate task definition — ~20%
          # cheaper per vCPU-second than X86_64.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/fraud-lake/api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/fraud-lake/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/fraud-lake/mcp:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/fraud-lake/mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.ECS_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register the new task definition revision
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition fraud-lake-api \
            --query taskDefinition > taskdef.json
          python - <<'PY'
          import json
          spec = json.load(open("taskdef.json"))
          for key in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                      "compatibilities", "registeredAt", "registeredBy"):
              spec.pop(key, None)
          import os
          registry = os.environ["ECR_REGISTRY"]
          spec["containerDefinitions"][0]["image"] = f"{registry}/fraud-lake/api:{os.environ['GITHUB_SHA']}"
          json.dump(spec, open("taskdef.json", "w"))
          PY
          arn=$(aws ecs register-task-definition --cli-input-json file://taskdef.json \
                 --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

      # NOTE: this updates the task definition but does NOT raise desired_count. The
      # service's steady state is 0 tasks, and a deploy is not a reason to start paying
      # for one — bring it up deliberately when demoing.
      - name: Update the service
        run: |
          aws ecs update-service \
            --cluster fraud-lake-cluster \
            --service fraud-lake-api \
            --task-definition ${{ steps.taskdef.outputs.arn }} \
            --no-cli-pager
          echo "Task definition updated. desired_count is unchanged — raise it manually to demo."
